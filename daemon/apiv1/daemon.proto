syntax = "proto3";

package toolbox.daemon.v1;

option go_package = "github.com/solidarity-ai/toolbox/daemon/apiv1;daemonv1";

import "google/protobuf/timestamp.proto";

message PingRequest {}

message PingResponse {
  string payload = 1;
  int32 pid = 2;
}

message SessionState {
  int32 pid = 1;
  string mode = 2;
  string working_dir = 3;
  repeated string prepared_tools = 4;
  repeated PendingApprovalSnapshot pending_approvals = 5;
  bool locked = 6;
  string bound_tb_session = 7;
  string intent_text = 8;
  string intent_source = 9;
  string intent_updated_at = 10;
}

message PendingApprovalSnapshot {
  string tool_call_id = 1;
  string tool_name = 2;
  string params_inspect = 3;
  string effect_id = 4;
  string status = 5;
  string error = 6;
  string tb_session = 7;
  string cell_id = 8;
  string full_tool_name = 9;
  string package_key = 10;
  string package_label = 11;
  string tool_label = 12;
  string description = 13;
  string presentation = 14;
  string created_at = 15;
  string updated_at = 16;
  string intent_text = 17;
  string intent_source = 18;
  string intent_updated_at = 19;
  bool requires_credentials = 20;
}

message ApprovalDecision {
  string action = 1;
  string tool_call_id = 2;
  string message = 3;
  string client_decision_id = 4;
  string queued_at = 5;
}

message ClientSnapshot {
  int32 pid = 1;
  string mode = 2;
  string working_dir = 3;
  repeated string prepared_tools = 4;
  google.protobuf.Timestamp connected_at = 5;
  google.protobuf.Timestamp last_sync_at = 6;
  repeated PendingApprovalSnapshot pending_approvals = 7;
  bool locked = 8;
  string bound_tb_session = 9;
  string intent_text = 10;
  string intent_source = 11;
  string intent_updated_at = 12;
}

message StateUpdate {
  repeated ClientSnapshot clients = 1;
  string secret_epoch = 2;
  repeated ApprovalDecision approval_decisions = 3;
}

message SecretGetRequest {
  string key = 1;
}

message SecretGetResponse {
  bytes value = 1;
}

message SecretSetRequest {
  string key = 1;
  bytes value = 2;
}

message SecretSetResponse {}

message SecretDeleteRequest {
  string key = 1;
}

message SecretDeleteResponse {}

message SecretListRequest {
  string prefix = 1;
}

message SecretListResponse {
  repeated string keys = 1;
}

message SecretUnlockRequest {
  string unlock_key = 1;
}

message SecretUnlockResponse {}

message SecretSetupRequest {
  string unlock_key = 1;
}

message SecretSetupResponse {
  repeated string backup_codes = 1;
}

message SecretLockRequest {}

message SecretLockResponse {}

message SecretInitializedRequest {}

message SecretInitializedResponse {
  bool initialized = 1;
}

message SecretBackupCodesRequest {
  string unlock_key = 1;
}

message SecretBackupCodesResponse {
  repeated string backup_codes = 1;
}

message SecretRecoveryCodesRequest {}

message SecretRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message SecretRecoveryUnlockedRequest {}

message SecretRecoveryUnlockedResponse {
  bool recovery_unlocked = 1;
}

message SecretRewrapAfterRecoveryRequest {
  string unlock_key = 1;
}

message SecretRewrapAfterRecoveryResponse {}

service SessionService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc SyncState(stream SessionState) returns (stream StateUpdate);
}

service SecretStoreService {
  rpc Unlock(SecretUnlockRequest) returns (SecretUnlockResponse);
  rpc Setup(SecretSetupRequest) returns (SecretSetupResponse);
  rpc Lock(SecretLockRequest) returns (SecretLockResponse);
  rpc Initialized(SecretInitializedRequest) returns (SecretInitializedResponse);
  rpc BackupCodes(SecretBackupCodesRequest) returns (SecretBackupCodesResponse);
  rpc RecoveryCodes(SecretRecoveryCodesRequest) returns (SecretRecoveryCodesResponse);
  rpc RecoveryUnlocked(SecretRecoveryUnlockedRequest) returns (SecretRecoveryUnlockedResponse);
  rpc RewrapAfterRecovery(SecretRewrapAfterRecoveryRequest) returns (SecretRewrapAfterRecoveryResponse);
  rpc Get(SecretGetRequest) returns (SecretGetResponse);
  rpc Set(SecretSetRequest) returns (SecretSetResponse);
  rpc Delete(SecretDeleteRequest) returns (SecretDeleteResponse);
  rpc List(SecretListRequest) returns (SecretListResponse);
}
