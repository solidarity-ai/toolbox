name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install emulate
        run: npm install -g emulate

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasmcli-sandbox/target
          key: rust-${{ runner.os }}-${{ hashFiles('wasmcli-sandbox/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build wasmcli-sandbox
        run: cargo build --manifest-path wasmcli-sandbox/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path wasmcli-sandbox/Cargo.toml

      - name: Go fmt check
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1 -timeout 300s
        env:
          GOPRIVATE: github.com/mackross/*

  release-workspace:
    name: Release workspace
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/mackross/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build toolbox for Node tests
        working-directory: cmd/toolbox
        run: |
          mkdir -p ../../release/.tmp
          go build -o ../../release/.tmp/toolbox .

      - name: Prepare npm dist smoke
        run: |
          mkdir -p release/.tmp/binaries
          cp release/.tmp/toolbox release/.tmp/binaries/toolbox-darwin-arm64
          cp release/.tmp/toolbox release/.tmp/binaries/toolbox-darwin-x64
          cp release/.tmp/toolbox release/.tmp/binaries/toolbox-linux-arm64
          cp release/.tmp/toolbox release/.tmp/binaries/toolbox-linux-x64
          cp release/.tmp/toolbox release/.tmp/binaries/toolbox-win32-x64.exe
          npm --prefix release run prepare-dist -- --version v0.0.0-preview.test --channel preview --binaries-dir release/.tmp/binaries --out-dir release/.tmp/dist-preview
          mkdir -p release/.tmp/stable-binaries
          cp release/.tmp/toolbox release/.tmp/stable-binaries/toolbox-darwin-arm64
          cp release/.tmp/toolbox release/.tmp/stable-binaries/toolbox-darwin-x64
          cp release/.tmp/toolbox release/.tmp/stable-binaries/toolbox-linux-arm64
          cp release/.tmp/toolbox release/.tmp/stable-binaries/toolbox-linux-x64
          npm --prefix release run prepare-dist -- --version v0.0.0 --channel stable --binaries-dir release/.tmp/stable-binaries --out-dir release/.tmp/dist-stable

      - name: Publish order dry run preview
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/release/.tmp/npm-cache
        run: node release/scripts/publish-npm.mjs --dist-dir release/.tmp/dist-preview --channel preview --dry-run

      - name: Publish order dry run stable
        env:
          NPM_CONFIG_CACHE: ${{ github.workspace }}/release/.tmp/npm-cache
        run: node release/scripts/publish-npm.mjs --dist-dir release/.tmp/dist-stable --channel stable --dry-run

      - name: Release workspace tests
        env:
          TOOLBOX_BINARY_PATH: ${{ github.workspace }}/release/.tmp/toolbox
        run: npm --prefix release test
