[package]
name = "wasmcli-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
socket2 = { version = "0.5.7", features = ["all"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "io-util"] }
tempfile = "3"
wasmer = { version = "6.1.0", features = ["cranelift", "sys"] }
wasmer-types = "6.1.0"
wasmer-wasix = { version = "0.601.0", default-features = false, features = ["sys"] }
wasmtime = { version = "33", features = ["component-model", "cache"] }
wasmtime-wasi = "33"
wasmtime-wasi-http = "33"

[dev-dependencies]
serde_json = "1"
