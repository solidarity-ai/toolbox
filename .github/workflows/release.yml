name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build ${{ matrix.binary_name }}
    if: ${{ !matrix.preview_only || contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.runner }}
    env:
      GOPRIVATE: github.com/mackross/*
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            binary_name: toolbox-linux-x64
            preview_only: false
          - runner: ubuntu-24.04-arm
            binary_name: toolbox-linux-arm64
            preview_only: false
          - runner: macos-13
            binary_name: toolbox-darwin-x64
            preview_only: false
          - runner: macos-14
            binary_name: toolbox-darwin-arm64
            preview_only: false
          - runner: windows-2022
            binary_name: toolbox-win32-x64.exe
            preview_only: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Build toolbox
        shell: bash
        working-directory: cmd/toolbox
        run: |
          mkdir -p ../../dist
          go build -o "../../dist/${{ matrix.binary_name }}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/raw-binaries
          merge-multiple: true

      - name: Resolve npm channel
        id: npm-channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        run: node release/scripts/build-release-assets.mjs --version "${GITHUB_REF_NAME}" --channel "${{ steps.npm-channel.outputs.channel }}" --binaries-dir release/raw-binaries --out-dir release/assets

      - name: Prepare npm dist
        run: node release/scripts/prepare-npm-dist.mjs --version "${GITHUB_REF_NAME}" --channel "${{ steps.npm-channel.outputs.channel }}" --binaries-dir release/raw-binaries --out-dir release/dist/npm

      - name: Publish npm packages
        run: node release/scripts/publish-npm.mjs --dist-dir release/dist/npm --channel "${{ steps.npm-channel.outputs.channel }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/assets/*
