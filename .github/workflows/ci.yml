name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasixcli-sandbox/target
          key: rust-${{ runner.os }}-${{ hashFiles('wasixcli-sandbox/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build wasixcli-sandbox
        run: cargo build --manifest-path wasixcli-sandbox/Cargo.toml

      - name: Go fmt check
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1 -timeout 300s
        env:
          GOPRIVATE: github.com/mackross/*
