name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build release binaries
    runs-on: ubuntu-24.04
    env:
      GOPRIVATE: github.com/mackross/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true

      - name: Build toolbox binaries
        shell: bash
        run: |
          mkdir -p dist
          # Toolbox is pure Go today, so cross-compiling from one Linux runner is faster.
          # Expand this back to per-platform runners if the release binary starts requiring native builds.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/toolbox-linux-x64 ./cmd/toolbox
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/toolbox-linux-arm64 ./cmd/toolbox
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o dist/toolbox-darwin-x64 ./cmd/toolbox
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/toolbox-darwin-arm64 ./cmd/toolbox
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/toolbox-win32-x64.exe ./cmd/toolbox

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: raw-binaries
          path: dist/*

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: raw-binaries
          path: release/raw-binaries

      - name: Resolve npm channel
        id: npm-channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release assets
        run: node release/scripts/build-release-assets.mjs --version "${GITHUB_REF_NAME}" --channel "${{ steps.npm-channel.outputs.channel }}" --binaries-dir release/raw-binaries --out-dir release/assets

      - name: Prepare npm dist
        run: node release/scripts/prepare-npm-dist.mjs --version "${GITHUB_REF_NAME}" --channel "${{ steps.npm-channel.outputs.channel }}" --binaries-dir release/raw-binaries --out-dir release/dist/npm

      - name: Publish npm packages
        run: node release/scripts/publish-npm.mjs --dist-dir release/dist/npm --channel "${{ steps.npm-channel.outputs.channel }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/assets/*
